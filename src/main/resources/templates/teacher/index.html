<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师管理 - 校园教务管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3>教务管理系统</h3></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='/'">&#9632; 首页</div>
                <div class="menu-group"><div class="menu-group-title">系统管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/user'">用户管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/dept'">院系管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/class'">班级管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/semester'">学期管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/config'">系统配置</div>
                    <div class="menu-item" onclick="window.location.href='/system/log'">操作日志</div>
                </div>
                <div class="menu-group"><div class="menu-group-title">教学管理</div>
                    <div class="menu-item" onclick="window.location.href='/student'">学生管理</div>
                    <div class="menu-item" onclick="window.location.href='/teacher'" style="background:rgba(255,255,255,0.1)">教师管理</div>
                    <div class="menu-item" onclick="window.location.href='/course'">课程管理</div>
                </div>
                <div class="menu-group"><div class="menu-group-title">资源管理</div>
                    <div class="menu-item" onclick="window.location.href='/classroom'">教室管理</div>
                    <div class="menu-item" onclick="window.location.href='/textbook'">教材管理</div>
                </div>
                <div class="menu-group"><div class="menu-group-title">教务管理</div>
                    <div class="menu-item" onclick="window.location.href='/selection'">选课管理</div>
                    <div class="menu-item" onclick="window.location.href='/scheduling'">排课管理</div>
                    <div class="menu-item" onclick="window.location.href='/grade'">成绩管理</div>
                    <div class="menu-item" onclick="window.location.href='/exam'">考试管理</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left"><span>教师管理</span></div>
                <div class="topbar-right"><span id="currentUser"></span>
                    <button class="btn btn-sm btn-danger" onclick="window.location.href='/login'">退出</button></div>
            </div>
            <div class="content">
                <div class="table-container">
                    <div class="search-bar">
                        <input type="text" id="searchTeacherNo" placeholder="工号">
                        <input type="text" id="searchName" placeholder="姓名">
                        <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增</button>
                    </div>
                    <table>
                        <thead><tr><th>工号</th><th>姓名</th><th>性别</th><th>院系</th><th>职称</th><th>学历</th><th>研究方向</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="pagination">
                        <div class="pagination-info" id="paginationInfo"></div>
                        <div class="pagination-btns" id="paginationBtns"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3 id="modalTitle">新增教师</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
            <form id="teacherForm">
                <input type="hidden" id="teacherId">
                <div class="form-group"><label>工号</label><input type="text" id="formTeacherNo" required></div>
                <div class="form-group"><label>姓名</label><input type="text" id="formName" required></div>
                <div class="form-group"><label>性别</label><select id="formGender"><option value="M">男</option><option value="F">女</option></select></div>
                <div class="form-group"><label>所属院系</label><select id="formDeptId" required></select></div>
                <div class="form-group"><label>电话</label><input type="text" id="formPhone"></div>
                <div class="form-group"><label>职称</label><select id="formTitle"><option value="教授">教授</option><option value="副教授">副教授</option><option value="讲师">讲师</option><option value="助教">助教</option></select></div>
                <div class="form-group"><label>学历</label><select id="formEducation"><option value="博士">博士</option><option value="硕士">硕士</option><option value="学士">学士</option></select></div>
                <div class="form-group"><label>研究方向</label><input type="text" id="formResearch"></div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        var currentPage = 1, deptList = [];

        function loadDepts() {
            fetch('/system/dept/all').then(function(res){ return res.json(); }).then(function(data) {
                if (data.code === 200) {
                    deptList = data.data;
                    var opts = '<option value="">请选择院系</option>';
                    deptList.forEach(function(d) { opts += '<option value="'+d.id+'">'+d.deptName+'</option>'; });
                    document.getElementById('formDeptId').innerHTML = opts;
                }
            });
        }
        function getDeptName(id) { var d = deptList.find(function(x){ return x.id === id; }); return d ? d.deptName : '-'; }

        function loadData(page) {
            currentPage = page || 1;
            var url = '/teacher/list?page=' + currentPage + '&size=10';
            var teacherNo = document.getElementById('searchTeacherNo').value;
            var name = document.getElementById('searchName').value;
            if (teacherNo) url += '&teacherNo=' + encodeURIComponent(teacherNo);
            if (name) url += '&name=' + encodeURIComponent(name);
            fetch(url).then(function(res) { return res.json(); }).then(function(data) {
                if (data.code === 200) { renderTable(data.data); }
            });
        }
        function renderTable(pd) {
            var tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (!pd.records || pd.records.length === 0) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">暂无数据</td></tr>'; return; }
            pd.records.forEach(function(item) {
                var genderText = item.gender === 'M' ? '男' : item.gender === 'F' ? '女' : '-';
                tbody.innerHTML += '<tr><td>' + (item.teacherNo||'') + '</td><td>' + (item.name||'') + '</td><td>' + genderText + '</td><td>' + getDeptName(item.deptId) + '</td><td>' + (item.title||'-') + '</td><td>' + (item.education||'-') + '</td><td>' + (item.researchDirection||'-') + '</td><td>' +
                    '<button class="btn btn-sm btn-primary" onclick="editTeacher('+item.id+')">编辑</button> ' +
                    '<button class="btn btn-sm btn-danger" onclick="deleteTeacher('+item.id+')">删除</button></td></tr>';
            });
            document.getElementById('paginationInfo').textContent = '共 ' + pd.total + ' 条，第 ' + pd.page + '/' + pd.pages + ' 页';
            var btns = document.getElementById('paginationBtns'); btns.innerHTML = '';
            for (var i = 1; i <= pd.pages; i++) {
                btns.innerHTML += '<button class="' + (i===currentPage?' active':'') + '" onclick="loadData('+i+')">' + i + '</button>';
            }
        }
        function showAddModal() { document.getElementById('teacherForm').reset(); document.getElementById('teacherId').value = ''; document.getElementById('modalTitle').textContent = '新增教师'; document.getElementById('modalOverlay').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
        function editTeacher(id) {
            fetch('/teacher/' + id).then(function(res) { return res.json(); }).then(function(data) {
                if (data.code === 200) {
                    var s = data.data;
                    document.getElementById('modalTitle').textContent = '编辑教师';
                    document.getElementById('teacherId').value = s.id;
                    document.getElementById('formTeacherNo').value = s.teacherNo||'';
                    document.getElementById('formName').value = s.name||'';
                    document.getElementById('formGender').value = s.gender||'M';
                    document.getElementById('formDeptId').value = s.deptId||'';
                    document.getElementById('formPhone').value = s.phone||'';
                    document.getElementById('formTitle').value = s.title||'讲师';
                    document.getElementById('formEducation').value = s.education||'博士';
                    document.getElementById('formResearch').value = s.researchDirection||'';
                    document.getElementById('modalOverlay').style.display = 'flex';
                }
            });
        }
        function deleteTeacher(id) {
            if (!confirm('确定删除？')) return;
            fetch('/teacher/' + id, { method: 'DELETE' }).then(function(res) { return res.json(); }).then(function(data) {
                if (data.code === 200) { alert('删除成功'); loadData(currentPage); } else { alert(data.message||'删除失败'); }
            });
        }
        document.getElementById('teacherForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var idVal = document.getElementById('teacherId').value;
            var data = {
                id: idVal ? parseInt(idVal) : null,
                teacherNo: document.getElementById('formTeacherNo').value,
                name: document.getElementById('formName').value,
                gender: document.getElementById('formGender').value,
                deptId: document.getElementById('formDeptId').value ? parseInt(document.getElementById('formDeptId').value) : null,
                phone: document.getElementById('formPhone').value,
                title: document.getElementById('formTitle').value,
                education: document.getElementById('formEducation').value,
                researchDirection: document.getElementById('formResearch').value
            };
            fetch('/teacher/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(function(res) { return res.json(); }).then(function(r) {
                if (r.code === 200) { alert('保存成功'); closeModal(); loadData(currentPage); } else { alert(r.message||'保存失败'); }
            });
        });
        loadDepts(); loadData(1);
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
