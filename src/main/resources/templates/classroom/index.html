<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室管理 - 校园教务管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3>教务管理系统</h3></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='/'">&#9632; 首页</div>
                <div class="menu-group">
                    <div class="menu-group-title">系统管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/user'">用户管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/dept'">院系管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/class'">班级管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/semester'">学期管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/config'">系统配置</div>
                    <div class="menu-item" onclick="window.location.href='/system/log'">操作日志</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教学管理</div>
                    <div class="menu-item" onclick="window.location.href='/student'">学生管理</div>
                    <div class="menu-item" onclick="window.location.href='/teacher'">教师管理</div>
                    <div class="menu-item" onclick="window.location.href='/course'">课程管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">资源管理</div>
                    <div class="menu-item" style="background:rgba(255,255,255,0.1)">教室管理</div>
                    <div class="menu-item" onclick="window.location.href='/textbook'">教材管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教务管理</div>
                    <div class="menu-item" onclick="window.location.href='/selection'">选课管理</div>
                    <div class="menu-item" onclick="window.location.href='/scheduling'">排课管理</div>
                    <div class="menu-item" onclick="window.location.href='/grade'">成绩管理</div>
                    <div class="menu-item" onclick="window.location.href='/exam'">考试管理</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left"><span>教室管理</span></div>
                <div class="topbar-right"><span id="currentUser"></span><button class="btn btn-sm btn-danger" onclick="window.location.href='/login'">退出</button></div>
            </div>
            <div class="content">
                <div class="table-container">
                    <div class="search-bar">
                        <input type="text" id="searchRoomNo" placeholder="教室号">
                        <input type="text" id="searchBuilding" placeholder="教学楼">
                        <select id="searchStatus">
                            <option value="">全部状态</option>
                            <option value="空闲">空闲</option>
                            <option value="占用">占用</option>
                            <option value="维修">维修</option>
                        </select>
                        <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增</button>
                    </div>
                    <table>
                        <thead><tr><th>教室号</th><th>教学楼</th><th>楼层</th><th>容量</th><th>类型</th><th>多媒体</th><th>投影仪</th><th>空调</th><th>状态</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="pagination"><div class="pagination-info" id="paginationInfo"></div><div class="pagination-btns" id="paginationBtns"></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3 id="modalTitle">新增教室</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
            <form id="classroomForm">
                <input type="hidden" id="classroomId">
                <div class="form-group"><label>教室号</label><input type="text" id="formRoomNo" required></div>
                <div class="form-group"><label>教学楼</label><input type="text" id="formBuilding" placeholder="如: 教学楼A"></div>
                <div class="form-group"><label>楼层</label><input type="number" id="formFloor"></div>
                <div class="form-group"><label>容量</label><input type="number" id="formCapacity" required></div>
                <div class="form-group"><label>类型</label><select id="formRoomType"><option value="普通教室">普通教室</option><option value="多媒体教室">多媒体教室</option><option value="机房">机房</option><option value="实验室">实验室</option><option value="语音室">语音室</option></select></div>
                <div class="form-group"><label>设备</label><div style="display:flex;gap:16px;padding-top:6px"><label><input type="checkbox" id="formMultimedia"> 多媒体</label><label><input type="checkbox" id="formProjector"> 投影仪</label><label><input type="checkbox" id="formAirConditioner"> 空调</label></div></div>
                <div class="form-group"><label>状态</label><select id="formStatus"><option value="空闲">空闲</option><option value="占用">占用</option><option value="维修">维修</option></select></div>
                <div class="form-group"><label>备注</label><input type="text" id="formDescription"></div>
                <div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
            </form>
        </div>
    </div>
    <script>
        var currentPage = 1, pageSize = 10;
        function loadData(page) {
            currentPage = page || 1;
            var url = '/classroom/list?page=' + currentPage + '&size=' + pageSize;
            var rn = document.getElementById('searchRoomNo').value;
            var b = document.getElementById('searchBuilding').value;
            var s = document.getElementById('searchStatus').value;
            if (rn) url += '&roomNo=' + encodeURIComponent(rn);
            if (b) url += '&building=' + encodeURIComponent(b);
            if (s) url += '&status=' + encodeURIComponent(s);
            fetch(url).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) renderTable(data.data); });
        }
        function renderTable(pd) {
            var tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if (!pd.records || pd.records.length === 0) { tbody.innerHTML = '<tr><td colspan="10" style="text-align:center">暂无数据</td></tr>'; return; }
            pd.records.forEach(function(item) {
                var yes = function(v) { return v===1?'<span class="badge badge-success">是</span>':'<span class="badge">-</span>'; };
                var stClass = item.status==='空闲'?'badge-success':item.status==='占用'?'badge-warning':'badge-danger';
                tbody.innerHTML += '<tr><td>'+(item.roomNo||'')+'</td><td>'+(item.building||'')+'</td><td>'+((item.floor!=null)?item.floor:'-')+'</td><td>'+(item.capacity||'')+'</td><td>'+(item.roomType||'')+'</td><td>'+yes(item.hasMultimedia)+'</td><td>'+yes(item.hasProjector)+'</td><td>'+yes(item.hasAirConditioner)+'</td><td><span class="badge '+stClass+'">'+(item.status||'')+'</span></td><td><button class="btn btn-sm btn-primary" onclick="editClassroom('+item.id+')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteClassroom('+item.id+')">删除</button></td></tr>';
            });
            document.getElementById('paginationInfo').textContent = '共 ' + pd.total + ' 条，第 ' + pd.page + '/' + pd.pages + ' 页';
            var btns = document.getElementById('paginationBtns'); btns.innerHTML = '';
            for (var i = 1; i <= pd.pages; i++) { btns.innerHTML += '<button class="'+(i===pd.page?' active':'')+'" onclick="loadData('+i+')">'+i+'</button>'; }
        }
        function showAddModal() { document.getElementById('modalTitle').textContent='新增教室'; document.getElementById('classroomForm').reset(); document.getElementById('classroomId').value=''; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        function editClassroom(id) {
            fetch('/classroom/list?page=1&size=100').then(function(res){ return res.json(); }).then(function(data) {
                if (data.code === 200) {
                    var item = data.data.records.find(function(x){ return x.id === id; });
                    if (item) {
                        document.getElementById('modalTitle').textContent='编辑教室';
                        document.getElementById('classroomId').value=item.id;
                        document.getElementById('formRoomNo').value=item.roomNo||'';
                        document.getElementById('formBuilding').value=item.building||'';
                        document.getElementById('formFloor').value=item.floor||'';
                        document.getElementById('formCapacity').value=item.capacity||'';
                        document.getElementById('formRoomType').value=item.roomType||'普通教室';
                        document.getElementById('formMultimedia').checked = item.hasMultimedia===1;
                        document.getElementById('formProjector').checked = item.hasProjector===1;
                        document.getElementById('formAirConditioner').checked = item.hasAirConditioner===1;
                        document.getElementById('formStatus').value=item.status||'空闲';
                        document.getElementById('formDescription').value=item.description||'';
                        document.getElementById('modalOverlay').style.display='flex';
                    }
                }
            });
        }
        function deleteClassroom(id) { if (!confirm('确定删除该教室吗？')) return; fetch('/classroom/' + id, {method:'DELETE'}).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) { alert('删除成功'); loadData(currentPage); } }); }
        document.getElementById('classroomForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var data = { id: document.getElementById('classroomId').value ? parseInt(document.getElementById('classroomId').value) : null, roomNo: document.getElementById('formRoomNo').value, building: document.getElementById('formBuilding').value, floor: document.getElementById('formFloor').value ? parseInt(document.getElementById('formFloor').value) : null, capacity: parseInt(document.getElementById('formCapacity').value), roomType: document.getElementById('formRoomType').value, hasMultimedia: document.getElementById('formMultimedia').checked?1:0, hasProjector: document.getElementById('formProjector').checked?1:0, hasAirConditioner: document.getElementById('formAirConditioner').checked?1:0, status: document.getElementById('formStatus').value, description: document.getElementById('formDescription').value };
            fetch('/classroom/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(function(res){ return res.json(); }).then(function(result) { if (result.code === 200) { alert('保存成功'); closeModal(); loadData(currentPage); } else alert(result.message||'保存失败'); });
        });
        loadData(1);
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
