<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教材管理 - 校园教务管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3>教务管理系统</h3></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='/'">&#9632; 首页</div>
                <div class="menu-group">
                    <div class="menu-group-title">系统管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/user'">用户管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/dept'">院系管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/class'">班级管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/semester'">学期管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/config'">系统配置</div>
                    <div class="menu-item" onclick="window.location.href='/system/log'">操作日志</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教学管理</div>
                    <div class="menu-item" onclick="window.location.href='/student'">学生管理</div>
                    <div class="menu-item" onclick="window.location.href='/teacher'">教师管理</div>
                    <div class="menu-item" onclick="window.location.href='/course'">课程管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">资源管理</div>
                    <div class="menu-item" onclick="window.location.href='/classroom'">教室管理</div>
                    <div class="menu-item" style="background:rgba(255,255,255,0.1)">教材管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教务管理</div>
                    <div class="menu-item" onclick="window.location.href='/selection'">选课管理</div>
                    <div class="menu-item" onclick="window.location.href='/scheduling'">排课管理</div>
                    <div class="menu-item" onclick="window.location.href='/grade'">成绩管理</div>
                    <div class="menu-item" onclick="window.location.href='/exam'">考试管理</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left"><span>教材管理</span></div>
                <div class="topbar-right"><span id="currentUser"></span><button class="btn btn-sm btn-danger" onclick="window.location.href='/login'">退出</button></div>
            </div>
            <div class="content">
                <div class="table-container">
                    <div class="search-bar">
                        <input type="text" id="searchIsbn" placeholder="ISBN">
                        <input type="text" id="searchTitle" placeholder="教材名称">
                        <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增</button>
                    </div>
                    <table>
                        <thead><tr><th>ISBN</th><th>教材名称</th><th>作者</th><th>出版社</th><th>版次</th><th>价格</th><th>库存</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="pagination"><div class="pagination-info" id="paginationInfo"></div><div class="pagination-btns" id="paginationBtns"></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3 id="modalTitle">新增教材</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
            <form id="textbookForm">
                <input type="hidden" id="textbookId">
                <div class="form-group"><label>ISBN</label><input type="text" id="formIsbn" required></div>
                <div class="form-group"><label>教材名称</label><input type="text" id="formTitle" required></div>
                <div class="form-group"><label>作者</label><input type="text" id="formAuthor"></div>
                <div class="form-group"><label>出版社</label><input type="text" id="formPublisher"></div>
                <div class="form-group"><label>出版日期</label><input type="date" id="formPublishDate"></div>
                <div class="form-group"><label>版次</label><input type="text" id="formEdition" placeholder="如: 第3版"></div>
                <div class="form-group"><label>价格</label><input type="number" step="0.01" id="formPrice"></div>
                <div class="form-group"><label>库存</label><input type="number" id="formStock" value="0"></div>
                <div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
            </form>
        </div>
    </div>
    <script>
        var currentPage = 1, pageSize = 10;
        function loadData(page) {
            currentPage = page || 1;
            var url = '/textbook/list?page=' + currentPage + '&size=' + pageSize;
            var isbn = document.getElementById('searchIsbn').value;
            var title = document.getElementById('searchTitle').value;
            if (isbn) url += '&isbn=' + encodeURIComponent(isbn);
            if (title) url += '&title=' + encodeURIComponent(title);
            fetch(url).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) renderTable(data.data); });
        }
        function renderTable(pd) {
            var tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if (!pd.records || pd.records.length === 0) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center">暂无数据</td></tr>'; return; }
            pd.records.forEach(function(item) {
                var stockClass = (item.stock != null && item.stock > 10) ? 'badge-success' : (item.stock != null && item.stock > 0) ? 'badge-warning' : 'badge-danger';
                tbody.innerHTML += '<tr><td>'+(item.isbn||'')+'</td><td>'+(item.title||'')+'</td><td>'+(item.author||'')+'</td><td>'+(item.publisher||'')+'</td><td>'+(item.edition||'')+'</td><td>'+(item.price?'¥'+item.price:'-')+'</td><td><span class="badge '+stockClass+'">'+(item.stock!=null?item.stock:0)+'</span></td><td><button class="btn btn-sm btn-primary" onclick="editTextbook('+item.id+')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteTextbook('+item.id+')">删除</button></td></tr>';
            });
            document.getElementById('paginationInfo').textContent = '共 ' + pd.total + ' 条，第 ' + pd.page + '/' + pd.pages + ' 页';
            var btns = document.getElementById('paginationBtns'); btns.innerHTML = '';
            for (var i = 1; i <= pd.pages; i++) { btns.innerHTML += '<button class="'+(i===pd.page?' active':'')+'" onclick="loadData('+i+')">'+i+'</button>'; }
        }
        function showAddModal() { document.getElementById('modalTitle').textContent='新增教材'; document.getElementById('textbookForm').reset(); document.getElementById('textbookId').value=''; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        function editTextbook(id) {
            fetch('/textbook/' + id).then(function(res){ return res.json(); }).then(function(data) {
                if (data.code === 200 && data.data) {
                    var item = data.data;
                    document.getElementById('modalTitle').textContent='编辑教材';
                    document.getElementById('textbookId').value=item.id;
                    document.getElementById('formIsbn').value=item.isbn||'';
                    document.getElementById('formTitle').value=item.title||'';
                    document.getElementById('formAuthor').value=item.author||'';
                    document.getElementById('formPublisher').value=item.publisher||'';
                    document.getElementById('formPublishDate').value=item.publishDate||'';
                    document.getElementById('formEdition').value=item.edition||'';
                    document.getElementById('formPrice').value=item.price||'';
                    document.getElementById('formStock').value=item.stock||0;
                    document.getElementById('modalOverlay').style.display='flex';
                }
            });
        }
        function deleteTextbook(id) { if (!confirm('确定删除该教材吗？')) return; fetch('/textbook/' + id, {method:'DELETE'}).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) { alert('删除成功'); loadData(currentPage); } }); }
        document.getElementById('textbookForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var data = { id: document.getElementById('textbookId').value ? parseInt(document.getElementById('textbookId').value) : null, isbn: document.getElementById('formIsbn').value, title: document.getElementById('formTitle').value, author: document.getElementById('formAuthor').value, publisher: document.getElementById('formPublisher').value, publishDate: document.getElementById('formPublishDate').value, edition: document.getElementById('formEdition').value, price: document.getElementById('formPrice').value ? parseFloat(document.getElementById('formPrice').value) : null, stock: parseInt(document.getElementById('formStock').value) };
            fetch('/textbook/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(function(res){ return res.json(); }).then(function(result) { if (result.code === 200) { alert('保存成功'); closeModal(); loadData(currentPage); } else alert(result.message||'保存失败'); });
        });
        loadData(1);
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
