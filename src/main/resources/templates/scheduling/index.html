<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排课管理 - 校园教务管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3>教务管理系统</h3></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='/'">&#9632; 首页</div>
                <div class="menu-group">
                    <div class="menu-group-title">系统管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/user'">用户管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/dept'">院系管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/class'">班级管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/semester'">学期管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/config'">系统配置</div>
                    <div class="menu-item" onclick="window.location.href='/system/log'">操作日志</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教学管理</div>
                    <div class="menu-item" onclick="window.location.href='/student'">学生管理</div>
                    <div class="menu-item" onclick="window.location.href='/teacher'">教师管理</div>
                    <div class="menu-item" onclick="window.location.href='/course'">课程管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">资源管理</div>
                    <div class="menu-item" onclick="window.location.href='/classroom'">教室管理</div>
                    <div class="menu-item" onclick="window.location.href='/textbook'">教材管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教务管理</div>
                    <div class="menu-item" onclick="window.location.href='/selection'">选课管理</div>
                    <div class="menu-item" style="background:rgba(255,255,255,0.1)">排课管理</div>
                    <div class="menu-item" onclick="window.location.href='/grade'">成绩管理</div>
                    <div class="menu-item" onclick="window.location.href='/exam'">考试管理</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left"><span>排课管理</span></div>
                <div class="topbar-right"><span id="currentUser"></span><button class="btn btn-sm btn-danger" onclick="window.location.href='/login'">退出</button></div>
            </div>
            <div class="content">
                <div class="table-container">
                    <div class="search-bar">
                        <select id="searchSemesterId"><option value="">全部学期</option></select>
                        <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增排课</button>
                    </div>
                    <table>
                        <thead><tr><th>课程</th><th>教师ID</th><th>教室ID</th><th>星期</th><th>时间</th><th>周次</th><th>节次</th><th>类型</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="pagination"><div class="pagination-info" id="paginationInfo"></div><div class="pagination-btns" id="paginationBtns"></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3>新增排课</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
            <form id="scheduleForm">
                <input type="hidden" id="scheduleId">
                <div class="form-group"><label>课程ID</label><input type="number" id="formCourseId" required></div>
                <div class="form-group"><label>教师ID</label><input type="number" id="formTeacherId" required></div>
                <div class="form-group"><label>教室ID</label><input type="number" id="formClassroomId" required></div>
                <div class="form-group"><label>班级ID</label><input type="number" id="formClassId"></div>
                <div class="form-group"><label>学期ID</label><input type="number" id="formSemesterId" required></div>
                <div class="form-group"><label>星期</label><select id="formDayOfWeek"><option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="7">周日</option></select></div>
                <div class="form-group"><label>开始时间</label><input type="time" id="formStartTime" required></div>
                <div class="form-group"><label>结束时间</label><input type="time" id="formEndTime" required></div>
                <div class="form-group"><label>起始周</label><input type="number" id="formWeekStart" value="1"></div>
                <div class="form-group"><label>结束周</label><input type="number" id="formWeekEnd" value="16"></div>
                <div class="form-group"><label>起始节次</label><input type="number" id="formSectionStart" value="1"></div>
                <div class="form-group"><label>结束节次</label><input type="number" id="formSectionEnd" value="2"></div>
                <div class="form-group"><label>备注</label><input type="text" id="formRemark"></div>
                <div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
            </form>
        </div>
    </div>
    <script>
        var currentPage = 1, pageSize = 10, dayNames = ['','周一','周二','周三','周四','周五','周六','周日'];
        function loadData(page) {
            currentPage = page || 1;
            var url = '/scheduling/list?page=' + currentPage + '&size=' + pageSize;
            var sid = document.getElementById('searchSemesterId').value;
            if (sid) url += '&semesterId=' + sid;
            fetch(url).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) renderTable(data.data); });
        }
        function renderTable(pd) {
            var tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if (!pd.records || pd.records.length === 0) { tbody.innerHTML = '<tr><td colspan="9" style="text-align:center">暂无数据</td></tr>'; return; }
            pd.records.forEach(function(item) {
                var typeBadge = item.scheduleType==='正常'?'badge-success':'badge-warning';
                tbody.innerHTML += '<tr><td>'+(item.courseId||'')+'</td><td>'+(item.teacherId||'')+'</td><td>'+(item.classroomId||'')+'</td><td>'+(dayNames[item.dayOfWeek]||'')+'</td><td>'+(item.startTime||'')+'-'+(item.endTime||'')+'</td><td>'+(item.weekStart||1)+'-'+(item.weekEnd||16)+'周</td><td>'+((item.sectionStart!=null)?item.sectionStart+'-'+item.sectionEnd:'-')+'节</td><td><span class="badge '+typeBadge+'">'+(item.scheduleType||'正常')+'</span></td><td><button class="btn btn-sm btn-danger" onclick="deleteSchedule('+item.id+')">删除</button></td></tr>';
            });
            document.getElementById('paginationInfo').textContent = '共 ' + pd.total + ' 条，第 ' + pd.page + '/' + pd.pages + ' 页';
            var btns = document.getElementById('paginationBtns'); btns.innerHTML = '';
            for (var i = 1; i <= pd.pages; i++) { btns.innerHTML += '<button class="'+(i===pd.page?' active':'')+'" onclick="loadData('+i+')">'+i+'</button>'; }
        }
        function showAddModal() { document.getElementById('scheduleForm').reset(); document.getElementById('scheduleId').value=''; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        function deleteSchedule(id) { if (!confirm('确定删除该排课吗？')) return; fetch('/scheduling/' + id, {method:'DELETE'}).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) { alert('删除成功'); loadData(currentPage); } else alert(data.message||'删除失败'); }); }
        document.getElementById('scheduleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var data = { id: document.getElementById('scheduleId').value ? parseInt(document.getElementById('scheduleId').value) : null, courseId: parseInt(document.getElementById('formCourseId').value), teacherId: parseInt(document.getElementById('formTeacherId').value), classroomId: parseInt(document.getElementById('formClassroomId').value), classId: document.getElementById('formClassId').value ? parseInt(document.getElementById('formClassId').value) : null, semesterId: parseInt(document.getElementById('formSemesterId').value), dayOfWeek: parseInt(document.getElementById('formDayOfWeek').value), startTime: document.getElementById('formStartTime').value, endTime: document.getElementById('formEndTime').value, weekStart: parseInt(document.getElementById('formWeekStart').value), weekEnd: parseInt(document.getElementById('formWeekEnd').value), sectionStart: parseInt(document.getElementById('formSectionStart').value), sectionEnd: parseInt(document.getElementById('formSectionEnd').value), remark: document.getElementById('formRemark').value };
            fetch('/scheduling/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(function(res){ return res.json(); }).then(function(result) { if (result.code === 200) { alert('排课成功'); closeModal(); loadData(currentPage); } else alert(result.message||'排课失败'); });
        });
        loadData(1);
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
