<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试管理 - 校园教务管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3>教务管理系统</h3></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='/'">&#9632; 首页</div>
                <div class="menu-group">
                    <div class="menu-group-title">系统管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/user'">用户管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/dept'">院系管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/class'">班级管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/semester'">学期管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/config'">系统配置</div>
                    <div class="menu-item" onclick="window.location.href='/system/log'">操作日志</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教学管理</div>
                    <div class="menu-item" onclick="window.location.href='/student'">学生管理</div>
                    <div class="menu-item" onclick="window.location.href='/teacher'">教师管理</div>
                    <div class="menu-item" onclick="window.location.href='/course'">课程管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">资源管理</div>
                    <div class="menu-item" onclick="window.location.href='/classroom'">教室管理</div>
                    <div class="menu-item" onclick="window.location.href='/textbook'">教材管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教务管理</div>
                    <div class="menu-item" onclick="window.location.href='/selection'">选课管理</div>
                    <div class="menu-item" onclick="window.location.href='/scheduling'">排课管理</div>
                    <div class="menu-item" onclick="window.location.href='/grade'">成绩管理</div>
                    <div class="menu-item" style="background:rgba(255,255,255,0.1)">考试管理</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left"><span>考试管理</span></div>
                <div class="topbar-right"><span id="currentUser"></span><button class="btn btn-sm btn-danger" onclick="window.location.href='/login'">退出</button></div>
            </div>
            <div class="content">
                <div class="table-container">
                    <div class="search-bar">
                        <select id="searchSemesterId"><option value="">全部学期</option></select>
                        <select id="searchExamType">
                            <option value="">全部类型</option>
                            <option value="期中">期中</option>
                            <option value="期末">期末</option>
                            <option value="补考">补考</option>
                            <option value="清考">清考</option>
                        </select>
                        <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增考试</button>
                    </div>
                    <table>
                        <thead><tr><th>考试名称</th><th>课程ID</th><th>学期ID</th><th>考场</th><th>考试日期</th><th>时间</th><th>类型</th><th>容量</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="pagination"><div class="pagination-info" id="paginationInfo"></div><div class="pagination-btns" id="paginationBtns"></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3>新增考试</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
            <form id="examForm">
                <input type="hidden" id="examId">
                <div class="form-group"><label>考试名称</label><input type="text" id="formExamName" required></div>
                <div class="form-group"><label>课程ID</label><input type="number" id="formCourseId" required></div>
                <div class="form-group"><label>学期ID</label><input type="number" id="formSemesterId" required></div>
                <div class="form-group"><label>考场教室ID</label><input type="number" id="formClassroomId"></div>
                <div class="form-group"><label>考试日期</label><input type="date" id="formExamDate" required></div>
                <div class="form-group"><label>开始时间</label><input type="time" id="formStartTime" required></div>
                <div class="form-group"><label>结束时间</label><input type="time" id="formEndTime" required></div>
                <div class="form-group"><label>类型</label><select id="formExamType"><option value="期中">期中</option><option value="期末">期末</option><option value="补考">补考</option><option value="清考">清考</option></select></div>
                <div class="form-group"><label>容量</label><input type="number" id="formCapacity"></div>
                <div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
            </form>
        </div>
    </div>
    <script>
        var currentPage = 1, pageSize = 10;
        function loadData(page) {
            currentPage = page || 1;
            var url = '/exam/list?page=' + currentPage + '&size=' + pageSize;
            var sid = document.getElementById('searchSemesterId').value;
            var et = document.getElementById('searchExamType').value;
            if (sid) url += '&semesterId=' + sid;
            if (et) url += '&examType=' + encodeURIComponent(et);
            fetch(url).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) renderTable(data.data); });
        }
        function renderTable(pd) {
            var tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if (!pd.records || pd.records.length === 0) { tbody.innerHTML = '<tr><td colspan="9" style="text-align:center">暂无数据</td></tr>'; return; }
            pd.records.forEach(function(item) {
                var typeBadge = item.examType==='期末'?'badge-primary':item.examType==='期中'?'badge-success':'badge-warning';
                tbody.innerHTML += '<tr><td>'+(item.examName||'')+'</td><td>'+(item.courseId||'')+'</td><td>'+(item.semesterId||'')+'</td><td>'+(item.classroomId||'-')+'</td><td>'+(item.examDate||'')+'</td><td>'+(item.startTime||'')+'-'+(item.endTime||'')+'</td><td><span class="badge '+typeBadge+'">'+(item.examType||'')+'</span></td><td>'+(item.capacity||'-')+'</td><td><button class="btn btn-sm btn-danger" onclick="deleteExam('+item.id+')">删除</button></td></tr>';
            });
            document.getElementById('paginationInfo').textContent = '共 ' + pd.total + ' 条，第 ' + pd.page + '/' + pd.pages + ' 页';
            var btns = document.getElementById('paginationBtns'); btns.innerHTML = '';
            for (var i = 1; i <= pd.pages; i++) { btns.innerHTML += '<button class="'+(i===pd.page?' active':'')+'" onclick="loadData('+i+')">'+i+'</button>'; }
        }
        function showAddModal() { document.getElementById('examForm').reset(); document.getElementById('examId').value=''; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        function deleteExam(id) { if (!confirm('确定删除该考试安排吗？')) return; fetch('/exam/' + id, {method:'DELETE'}).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) { alert('删除成功'); loadData(currentPage); } }); }
        document.getElementById('examForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var data = { id: document.getElementById('examId').value ? parseInt(document.getElementById('examId').value) : null, examName: document.getElementById('formExamName').value, courseId: parseInt(document.getElementById('formCourseId').value), semesterId: parseInt(document.getElementById('formSemesterId').value), classroomId: document.getElementById('formClassroomId').value ? parseInt(document.getElementById('formClassroomId').value) : null, examDate: document.getElementById('formExamDate').value, startTime: document.getElementById('formStartTime').value, endTime: document.getElementById('formEndTime').value, examType: document.getElementById('formExamType').value, capacity: document.getElementById('formCapacity').value ? parseInt(document.getElementById('formCapacity').value) : null };
            fetch('/exam/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(function(res){ return res.json(); }).then(function(result) { if (result.code === 200) { alert('保存成功'); closeModal(); loadData(currentPage); } else alert(result.message||'保存失败'); });
        });
        loadData(1);
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
