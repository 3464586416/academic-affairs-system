<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>院系管理 - 校园教务管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3>教务管理系统</h3></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='/'">&#9632; 首页</div>
                <div class="menu-group">
                    <div class="menu-group-title">系统管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/user'">用户管理</div>
                    <div class="menu-item" style="background:rgba(255,255,255,0.1)">院系管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/class'">班级管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/semester'">学期管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/config'">系统配置</div>
                    <div class="menu-item" onclick="window.location.href='/system/log'">操作日志</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教学管理</div>
                    <div class="menu-item" onclick="window.location.href='/student'">学生管理</div>
                    <div class="menu-item" onclick="window.location.href='/teacher'">教师管理</div>
                    <div class="menu-item" onclick="window.location.href='/course'">课程管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">资源管理</div>
                    <div class="menu-item" onclick="window.location.href='/classroom'">教室管理</div>
                    <div class="menu-item" onclick="window.location.href='/textbook'">教材管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教务管理</div>
                    <div class="menu-item" onclick="window.location.href='/selection'">选课管理</div>
                    <div class="menu-item" onclick="window.location.href='/scheduling'">排课管理</div>
                    <div class="menu-item" onclick="window.location.href='/grade'">成绩管理</div>
                    <div class="menu-item" onclick="window.location.href='/exam'">考试管理</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left"><span>院系管理</span></div>
                <div class="topbar-right"><span id="currentUser"></span><button class="btn btn-sm btn-danger" onclick="window.location.href='/login'">退出</button></div>
            </div>
            <div class="content">
                <div class="table-container">
                    <div class="search-bar">
                        <input type="text" id="searchDeptName" placeholder="院系名称">
                        <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增</button>
                    </div>
                    <table>
                        <thead><tr><th>ID</th><th>院系名称</th><th>院系编码</th><th>描述</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="pagination"><div class="pagination-info" id="paginationInfo"></div><div class="pagination-btns" id="paginationBtns"></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3 id="modalTitle">新增院系</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
            <form id="deptForm">
                <input type="hidden" id="deptId">
                <div class="form-group"><label>院系名称</label><input type="text" id="formDeptName" required></div>
                <div class="form-group"><label>院系编码</label><input type="text" id="formDeptCode" required></div>
                <div class="form-group"><label>描述</label><input type="text" id="formDescription"></div>
                <div class="form-group"><label>状态</label><select id="formStatus"><option value="1">启用</option><option value="0">停用</option></select></div>
                <div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
            </form>
        </div>
    </div>
    <script>
        var currentPage = 1, pageSize = 10;
        function loadData(page) {
            currentPage = page || 1;
            var url = '/system/dept/list?page=' + currentPage + '&size=' + pageSize;
            var dn = document.getElementById('searchDeptName').value;
            if (dn) url += '&deptName=' + encodeURIComponent(dn);
            fetch(url).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) renderTable(data.data); });
        }
        function renderTable(pd) {
            var tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if (!pd.records || pd.records.length === 0) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center">暂无数据</td></tr>'; return; }
            pd.records.forEach(function(item) {
                var st = item.status === 1 ? '<span class="badge badge-success">启用</span>' : '<span class="badge badge-danger">停用</span>';
                tbody.innerHTML += '<tr><td>'+item.id+'</td><td>'+(item.deptName||'')+'</td><td>'+(item.deptCode||'')+'</td><td>'+(item.description||'')+'</td><td>'+st+'</td><td>'+(item.createdAt||'')+'</td><td><button class="btn btn-sm btn-primary" onclick="editDept('+item.id+')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteDept('+item.id+')">删除</button></td></tr>';
            });
            document.getElementById('paginationInfo').textContent = '共 ' + pd.total + ' 条，第 ' + pd.page + '/' + pd.pages + ' 页';
            var btns = document.getElementById('paginationBtns'); btns.innerHTML = '';
            for (var i = 1; i <= pd.pages; i++) { btns.innerHTML += '<button class="'+(i===pd.page?' active':'')+'" onclick="loadData('+i+')">'+i+'</button>'; }
        }
        function showAddModal() { document.getElementById('modalTitle').textContent='新增院系'; document.getElementById('deptForm').reset(); document.getElementById('deptId').value=''; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        function editDept(id) {
            fetch('/system/dept/list?page=1&size=100').then(function(res){ return res.json(); }).then(function(data) {
                if (data.code === 200) {
                    var item = data.data.records.find(function(x){ return x.id === id; });
                    if (item) {
                        document.getElementById('modalTitle').textContent='编辑院系';
                        document.getElementById('deptId').value=item.id;
                        document.getElementById('formDeptName').value=item.deptName||'';
                        document.getElementById('formDeptCode').value=item.deptCode||'';
                        document.getElementById('formDescription').value=item.description||'';
                        document.getElementById('formStatus').value=item.status||1;
                        document.getElementById('modalOverlay').style.display='flex';
                    }
                }
            });
        }
        function deleteDept(id) { if (!confirm('确定删除该院系吗？')) return; fetch('/system/dept/' + id, {method:'DELETE'}).then(function(res){ return res.json(); }).then(function(data) { if (data.code === 200) { alert('删除成功'); loadData(currentPage); } }); }
        document.getElementById('deptForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var data = { id: document.getElementById('deptId').value ? parseInt(document.getElementById('deptId').value) : null, deptName: document.getElementById('formDeptName').value, deptCode: document.getElementById('formDeptCode').value, description: document.getElementById('formDescription').value, status: parseInt(document.getElementById('formStatus').value) };
            fetch('/system/dept/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(function(res){ return res.json(); }).then(function(result) { if (result.code === 200) { alert('保存成功'); closeModal(); loadData(currentPage); } else alert(result.message||'保存失败'); });
        });
        loadData(1);
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
