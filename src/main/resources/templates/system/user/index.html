<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 校园教务管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3>教务管理系统</h3></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='/'">&#9632; 首页</div>
                <div class="menu-group">
                    <div class="menu-group-title">系统管理</div>
                    <div class="menu-item" style="background:rgba(255,255,255,0.1)">用户管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/dept'">院系管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/class'">班级管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/semester'">学期管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/config'">系统配置</div>
                    <div class="menu-item" onclick="window.location.href='/system/log'">操作日志</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教学管理</div>
                    <div class="menu-item" onclick="window.location.href='/student'">学生管理</div>
                    <div class="menu-item" onclick="window.location.href='/teacher'">教师管理</div>
                    <div class="menu-item" onclick="window.location.href='/course'">课程管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">资源管理</div>
                    <div class="menu-item" onclick="window.location.href='/classroom'">教室管理</div>
                    <div class="menu-item" onclick="window.location.href='/textbook'">教材管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教务管理</div>
                    <div class="menu-item" onclick="window.location.href='/selection'">选课管理</div>
                    <div class="menu-item" onclick="window.location.href='/scheduling'">排课管理</div>
                    <div class="menu-item" onclick="window.location.href='/grade'">成绩管理</div>
                    <div class="menu-item" onclick="window.location.href='/exam'">考试管理</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left"><span>用户管理</span></div>
                <div class="topbar-right">
                    <span id="currentUser"></span>
                    <button class="btn btn-sm btn-danger" onclick="window.location.href='/login'">退出</button>
                </div>
            </div>
            <div class="content">
                <div class="table-container">
                    <div class="search-bar">
                        <input type="text" id="searchUsername" placeholder="用户名">
                        <input type="text" id="searchRealName" placeholder="真实姓名">
                        <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th><th>用户名</th><th>真实姓名</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="pagination">
                        <div class="pagination-info" id="paginationInfo"></div>
                        <div class="pagination-btns" id="paginationBtns"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3 id="modalTitle">新增用户</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group"><label>用户名</label><input type="text" id="formUsername" required></div>
                <div class="form-group"><label>密码</label><input type="password" id="formPassword" placeholder="新增必填，编辑可留空"></div>
                <div class="form-group"><label>真实姓名</label><input type="text" id="formRealName"></div>
                <div class="form-group">
                    <label>状态</label>
                    <select id="formStatus"><option value="1">启用</option><option value="0">禁用</option></select>
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select id="formRoleIds" multiple size="3" style="width:100%"></select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var currentPage = 1, pageSize = 10, allRoles = [];
        function loadRoles() {
            fetch('/system/user/roles').then(function(res){ return res.json(); }).then(function(data) {
                if (data.code === 200) {
                    allRoles = data.data;
                    var opts = '';
                    allRoles.forEach(function(r) { opts += '<option value="'+r.id+'">'+r.roleName+'</option>'; });
                    document.getElementById('formRoleIds').innerHTML = opts;
                }
            });
        }
        function loadData(page) {
            currentPage = page || 1;
            var url = '/system/user/list?page=' + currentPage + '&size=' + pageSize;
            var u = document.getElementById('searchUsername').value;
            var r = document.getElementById('searchRealName').value;
            if (u) url += '&username=' + encodeURIComponent(u);
            if (r) url += '&realName=' + encodeURIComponent(r);
            fetch(url).then(function(res){ return res.json(); }).then(function(data) {
                if (data.code === 200) renderTable(data.data);
            });
        }
        function renderTable(pd) {
            var tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if (!pd.records || pd.records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center">暂无数据</td></tr>'; return;
            }
            pd.records.forEach(function(item) {
                var st = item.status === 1 ? '<span class="badge badge-success">启用</span>' : '<span class="badge badge-danger">禁用</span>';
                var roles = (item.roleNames || []).map(function(r){ return '<span class="badge">'+r+'</span>'; }).join(' ');
                tbody.innerHTML += '<tr><td>'+item.id+'</td><td>'+(item.username||'')+'</td><td>'+(item.realName||'')+'</td><td>'+roles+'</td><td>'+st+'</td><td>'+(item.createdAt||'')+'</td><td><button class="btn btn-sm btn-primary" onclick="editUser('+item.id+')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteUser('+item.id+')">删除</button></td></tr>';
            });
            document.getElementById('paginationInfo').textContent = '共 ' + pd.total + ' 条，第 ' + pd.page + '/' + pd.pages + ' 页';
            var btns = document.getElementById('paginationBtns'); btns.innerHTML = '';
            for (var i = 1; i <= pd.pages; i++) {
                if (pd.pages > 7 && Math.abs(i - pd.page) > 2 && i !== 1 && i !== pd.pages) { if (i===2||i===pd.pages-1) btns.innerHTML += '<button disabled>...</button>'; continue; }
                btns.innerHTML += '<button class="' + (i===pd.page?' active':'') + '" onclick="loadData('+i+')">' + i + '</button>';
            }
        }
        function showAddModal() { document.getElementById('modalTitle').textContent='新增用户'; document.getElementById('userForm').reset(); document.getElementById('userId').value=''; document.getElementById('formPassword').value=''; document.getElementById('formRoleIds').value=''; document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        function editUser(id) {
            fetch('/system/user/' + id).then(function(res){ return res.json(); }).then(function(data) {
                if (data.code === 200) {
                    var s = data.data;
                    document.getElementById('modalTitle').textContent='编辑用户';
                    document.getElementById('userId').value=s.id;
                    document.getElementById('formUsername').value=s.username||'';
                    document.getElementById('formPassword').value='';
                    document.getElementById('formRealName').value=s.realName||'';
                    document.getElementById('formStatus').value=s.status||1;
                    var rids = s.roleIds || [];
                    var roleSelect = document.getElementById('formRoleIds');
                    for (var i = 0; i < roleSelect.options.length; i++) {
                        roleSelect.options[i].selected = rids.indexOf(parseInt(roleSelect.options[i].value)) >= 0;
                    }
                    document.getElementById('modalOverlay').style.display='flex';
                }
            });
        }
        function deleteUser(id) {
            if (!confirm('确定删除该用户吗？')) return;
            fetch('/system/user/' + id, {method:'DELETE'}).then(function(res){ return res.json(); }).then(function(data) {
                if (data.code === 200) { alert('删除成功'); loadData(currentPage); } else alert(data.message||'删除失败');
            });
        }
        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var id = document.getElementById('userId').value;
            var roleSelect = document.getElementById('formRoleIds');
            var roleIds = [];
            for (var i = 0; i < roleSelect.options.length; i++) {
                if (roleSelect.options[i].selected) roleIds.push(roleSelect.options[i].value);
            }
            var data = { id: id ? parseInt(id) : null, username: document.getElementById('formUsername').value, realName: document.getElementById('formRealName').value, status: parseInt(document.getElementById('formStatus').value), roleIds: roleIds };
            var pw = document.getElementById('formPassword').value;
            if (pw) data.password = pw;
            fetch('/system/user/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) }).then(function(res){ return res.json(); }).then(function(result) {
                if (result.code === 200) { alert('保存成功'); closeModal(); loadData(currentPage); } else alert(result.message||'保存失败');
            });
        });
        loadRoles(); loadData(1);
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
