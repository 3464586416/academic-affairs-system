<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理 - 校园教务管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3>教务管理系统</h3></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='/'">&#9632; 首页</div>
                <div class="menu-group">
                    <div class="menu-group-title">系统管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/user'">用户管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/dept'">院系管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/class'">班级管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/semester'">学期管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/config'">系统配置</div>
                    <div class="menu-item" onclick="window.location.href='/system/log'">操作日志</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教学管理</div>
                    <div class="menu-item" style="background:rgba(255,255,255,0.1)">学生管理</div>
                    <div class="menu-item" onclick="window.location.href='/teacher'">教师管理</div>
                    <div class="menu-item" onclick="window.location.href='/course'">课程管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">资源管理</div>
                    <div class="menu-item" onclick="window.location.href='/classroom'">教室管理</div>
                    <div class="menu-item" onclick="window.location.href='/textbook'">教材管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教务管理</div>
                    <div class="menu-item" onclick="window.location.href='/selection'">选课管理</div>
                    <div class="menu-item" onclick="window.location.href='/scheduling'">排课管理</div>
                    <div class="menu-item" onclick="window.location.href='/grade'">成绩管理</div>
                    <div class="menu-item" onclick="window.location.href='/exam'">考试管理</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left"><span>学生管理</span></div>
                <div class="topbar-right">
                    <span id="currentUser"></span>
                    <button class="btn btn-sm btn-danger" onclick="window.location.href='/login'">退出</button>
                </div>
            </div>
            <div class="content">
                <div class="table-container">
                    <div class="search-bar">
                        <input type="text" id="searchStudentNo" placeholder="学号">
                        <input type="text" id="searchName" placeholder="姓名">
                        <select id="searchEnrollStatus">
                            <option value="">全部状态</option>
                            <option value="在读">在读</option>
                            <option value="休学">休学</option>
                            <option value="毕业">毕业</option>
                        </select>
                        <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增</button>
                        <button class="btn btn-info" onclick="showImportModal()">导入</button>
                        <button class="btn btn-warning" onclick="exportData()">导出</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>学号</th><th>姓名</th><th>性别</th><th>邮箱</th><th>电话</th><th>入学年份</th><th>学籍状态</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="pagination">
                        <div class="pagination-info" id="paginationInfo"></div>
                        <div class="pagination-btns" id="paginationBtns"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3 id="modalTitle">新增学生</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="form-group"><label>学号</label><input type="text" id="formStudentNo" required></div>
                <div class="form-group"><label>姓名</label><input type="text" id="formName" required></div>
                <div class="form-group"><label>性别</label><select id="formGender"><option value="M">男</option><option value="F">女</option></select></div>
                <div class="form-group"><label>班级</label><select id="formClassId" required></select></div>
                <div class="form-group"><label>邮箱</label><input type="email" id="formEmail"></div>
                <div class="form-group"><label>电话</label><input type="text" id="formPhone"></div>
                <div class="form-group"><label>入学年份</label><input type="text" id="formEnrollmentYear" required placeholder="如: 2024"></div>
                <div class="form-group"><label>学籍状态</label><select id="formEnrollStatus"><option value="在读">在读</option><option value="休学">休学</option><option value="毕业">毕业</option></select></div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="importModal" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3>导入学生</h3><span class="modal-close" onclick="document.getElementById('importModal').style.display='none'">&times;</span></div>
            <form id="importForm" enctype="multipart/form-data">
                <div class="form-group"><label>Excel文件</label><input type="file" id="importFile" accept=".xlsx,.xls"></div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="document.getElementById('importModal').style.display='none'">取消</button>
                    <button type="submit" class="btn btn-primary">导入</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var currentPage = 1, pageSize = 10, classList = [];

        function loadClasses() {
            fetch('/system/class/all').then(function(res){ return res.json(); }).then(function(data) {
                if (data.code === 200) {
                    classList = data.data;
                    var opts = '<option value="">请选择班级</option>';
                    classList.forEach(function(c) { opts += '<option value="'+c.id+'">'+c.className+'</option>'; });
                    document.getElementById('formClassId').innerHTML = opts;
                }
            });
        }
        function getClassName(id) { var c = classList.find(function(x){ return x.id === id; }); return c ? c.className : '-'; }

        function loadData(page) {
            currentPage = page || 1;
            var url = '/student/list?page=' + currentPage + '&size=' + pageSize;
            var studentNo = document.getElementById('searchStudentNo').value;
            var name = document.getElementById('searchName').value;
            var status = document.getElementById('searchEnrollStatus').value;
            if (studentNo) url += '&studentNo=' + encodeURIComponent(studentNo);
            if (name) url += '&name=' + encodeURIComponent(name);
            if (status) url += '&enrollStatus=' + encodeURIComponent(status);
            fetch(url).then(function(res) { return res.json(); })
                .then(function(data) { if (data.code === 200) renderTable(data.data); });
        }
        function renderTable(pageData) {
            var tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if (!pageData.records || pageData.records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center">暂无数据</td></tr>'; return;
            }
            pageData.records.forEach(function(item) {
                var statusBadge = item.enrollStatus === '在读' ? 'badge-success' : item.enrollStatus === '毕业' ? 'badge-info' : 'badge-warning';
                var genderText = item.gender === 'M' ? '男' : item.gender === 'F' ? '女' : '-';
                tbody.innerHTML += '<tr><td>'+(item.studentNo||'')+'</td><td>'+(item.name||'')+'</td><td>'+genderText+'</td><td>'+(item.email||'')+'</td><td>'+(item.phone||'')+'</td><td>'+(item.enrollmentYear||'')+'</td><td><span class="badge '+statusBadge+'">'+(item.enrollStatus||'')+'</span></td><td><button class="btn btn-sm btn-primary" onclick="editStudent('+item.id+')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteStudent('+item.id+')">删除</button></td></tr>';
            });
            document.getElementById('paginationInfo').textContent = '共 ' + pageData.total + ' 条，第 ' + pageData.page + '/' + pageData.pages + ' 页';
            var btns = document.getElementById('paginationBtns'); btns.innerHTML = '';
            for (var i = 1; i <= pageData.pages; i++) {
                if (pageData.pages > 7 && Math.abs(i - pageData.page) > 2 && i !== 1 && i !== pageData.pages) { if (i===2||i===pageData.pages-1) btns.innerHTML += '<button disabled>...</button>'; continue; }
                btns.innerHTML += '<button class="'+(i===pageData.page?' active':'')+'" onclick="loadData('+i+')">'+i+'</button>';
            }
        }
        function showAddModal() {
            document.getElementById('modalTitle').textContent = '新增学生';
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('modalOverlay').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
        function editStudent(id) {
            fetch('/student/' + id).then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.code === 200) {
                        var s = data.data;
                        document.getElementById('modalTitle').textContent = '编辑学生';
                        document.getElementById('studentId').value = s.id;
                        document.getElementById('formStudentNo').value = s.studentNo || '';
                        document.getElementById('formName').value = s.name || '';
                        document.getElementById('formGender').value = s.gender || 'M';
                        document.getElementById('formClassId').value = s.classId || '';
                        document.getElementById('formEmail').value = s.email || '';
                        document.getElementById('formPhone').value = s.phone || '';
                        document.getElementById('formEnrollmentYear').value = s.enrollmentYear || '';
                        document.getElementById('formEnrollStatus').value = s.enrollStatus || '在读';
                        document.getElementById('modalOverlay').style.display = 'flex';
                    }
                });
        }
        function deleteStudent(id) {
            if (!confirm('确定删除该学生吗？')) return;
            fetch('/student/' + id, { method: 'DELETE' }).then(function(res) { return res.json(); })
                .then(function(data) { if (data.code === 200) { alert('删除成功'); loadData(currentPage); } else alert(data.message || '删除失败'); });
        }
        function exportData() { window.location.href = '/student/export'; }
        function showImportModal() { document.getElementById('importModal').style.display = 'flex'; }

        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var idVal = document.getElementById('studentId').value;
            var data = {
                id: idVal ? parseInt(idVal) : null,
                studentNo: document.getElementById('formStudentNo').value,
                name: document.getElementById('formName').value,
                gender: document.getElementById('formGender').value,
                classId: document.getElementById('formClassId').value ? parseInt(document.getElementById('formClassId').value) : null,
                email: document.getElementById('formEmail').value,
                phone: document.getElementById('formPhone').value,
                enrollmentYear: document.getElementById('formEnrollmentYear').value,
                enrollStatus: document.getElementById('formEnrollStatus').value
            };
            fetch('/student/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
                .then(function(res) { return res.json(); })
                .then(function(result) { if (result.code === 200) { alert('保存成功'); closeModal(); loadData(currentPage); } else alert(result.message || '保存失败'); });
        });

        document.getElementById('importForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var file = document.getElementById('importFile').files[0];
            if (!file) { alert('请选择文件'); return; }
            var formData = new FormData();
            formData.append('file', file);
            fetch('/student/import', { method: 'POST', body: formData })
                .then(function(res) { return res.json(); })
                .then(function(data) { alert(data.message || '导入完成'); document.getElementById('importModal').style.display = 'none'; loadData(currentPage); });
        });

        loadClasses(); loadData(1);
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
