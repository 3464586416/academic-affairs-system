<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程管理 - 校园教务管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><h3>教务管理系统</h3></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='/'">&#9632; 首页</div>
                <div class="menu-group">
                    <div class="menu-group-title">系统管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/user'">用户管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/dept'">院系管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/class'">班级管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/semester'">学期管理</div>
                    <div class="menu-item" onclick="window.location.href='/system/config'">系统配置</div>
                    <div class="menu-item" onclick="window.location.href='/system/log'">操作日志</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教学管理</div>
                    <div class="menu-item" onclick="window.location.href='/student'">学生管理</div>
                    <div class="menu-item" onclick="window.location.href='/teacher'">教师管理</div>
                    <div class="menu-item" style="background:rgba(255,255,255,0.1)">课程管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">资源管理</div>
                    <div class="menu-item" onclick="window.location.href='/classroom'">教室管理</div>
                    <div class="menu-item" onclick="window.location.href='/textbook'">教材管理</div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title">教务管理</div>
                    <div class="menu-item" onclick="window.location.href='/selection'">选课管理</div>
                    <div class="menu-item" onclick="window.location.href='/scheduling'">排课管理</div>
                    <div class="menu-item" onclick="window.location.href='/grade'">成绩管理</div>
                    <div class="menu-item" onclick="window.location.href='/exam'">考试管理</div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div class="topbar-left"><span>课程管理</span></div>
                <div class="topbar-right"><span id="currentUser"></span>
                    <button class="btn btn-sm btn-danger" onclick="window.location.href='/login'">退出</button></div>
            </div>
            <div class="content">
                <div class="table-container">
                    <div class="search-bar">
                        <input type="text" id="searchCourseNo" placeholder="课程号">
                        <input type="text" id="searchCourseName" placeholder="课程名称">
                        <select id="searchCourseType"><option value="">全部类型</option><option value="公共必修">公共必修</option><option value="专业必修">专业必修</option><option value="专业选修">专业选修</option><option value="公共选修">公共选修</option></select>
                        <button class="btn btn-primary" onclick="loadData(1)">搜索</button>
                        <button class="btn btn-success" onclick="showAddModal()">新增</button>
                    </div>
                    <table>
                        <thead><tr><th>课程号</th><th>课程名称</th><th>类型</th><th>学分</th><th>学时</th><th>理论学时</th><th>实践学时</th><th>操作</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                    <div class="pagination"><div class="pagination-info" id="paginationInfo"></div><div class="pagination-btns" id="paginationBtns"></div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header"><h3 id="modalTitle">新增课程</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
            <form id="courseForm">
                <input type="hidden" id="courseId">
                <div class="form-group"><label>课程号</label><input type="text" id="formCourseNo" required></div>
                <div class="form-group"><label>课程名称</label><input type="text" id="formCourseName" required></div>
                <div class="form-group"><label>课程类型</label><select id="formCourseType"><option value="公共必修">公共必修</option><option value="专业必修">专业必修</option><option value="专业选修">专业选修</option><option value="公共选修">公共选修</option></select></div>
                <div class="form-group"><label>学分</label><input type="number" step="0.5" id="formCredits" required></div>
                <div class="form-group"><label>总学时</label><input type="number" id="formClassHours" required></div>
                <div class="form-group"><label>理论学时</label><input type="number" id="formTheoryHours" value="0"></div>
                <div class="form-group"><label>实践学时</label><input type="number" id="formPracticeHours" value="0"></div>
                <div class="form-group"><label>开课院系</label><select id="formDeptId" onchange="filterTeachers()"><option value="">请选择</option></select></div>
                <div class="form-group"><label>主讲教师</label><select id="formTeacherId"><option value="">请选择</option></select></div>
                <div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
            </form>
        </div>
    </div>
    <script>
        var currentPage = 1, deptList = [], teacherList = [];
        function loadSelectData() {
            fetch('/system/dept/all').then(function(res){return res.json();}).then(function(data){
                if(data.code===200){deptList=data.data;var opts='<option value="">请选择</option>';deptList.forEach(function(d){opts+='<option value="'+d.id+'">'+d.deptName+'</option>';});document.getElementById('formDeptId').innerHTML=opts;}
            });
            fetch('/teacher/all').then(function(res){return res.json();}).then(function(data){
                if(data.code===200){teacherList=data.data;filterTeachers();}
            });
        }
        function filterTeachers() {
            var deptId = document.getElementById('formDeptId').value;
            var filtered = deptId ? teacherList.filter(function(t){ return t.deptId == deptId; }) : teacherList;
            var opts = '<option value="">请选择</option>';
            filtered.forEach(function(t){ opts += '<option value="'+t.id+'">'+t.name+'</option>'; });
            document.getElementById('formTeacherId').innerHTML = opts;
        }
        function getDeptName(id){var d=deptList.find(function(x){return x.id===id;});return d?d.deptName:'-';}
        function getTeacherName(id){var t=teacherList.find(function(x){return x.id===id;});return t?t.name:'-';}
        function loadData(page) {
            currentPage = page || 1;
            var url = '/course/list?page=' + currentPage + '&size=10';
            var courseNo = document.getElementById('searchCourseNo').value;
            var courseName = document.getElementById('searchCourseName').value;
            var courseType = document.getElementById('searchCourseType').value;
            if (courseNo) url += '&courseNo=' + encodeURIComponent(courseNo);
            if (courseName) url += '&courseName=' + encodeURIComponent(courseName);
            if (courseType) url += '&courseType=' + encodeURIComponent(courseType);
            fetch(url).then(function(res) { return res.json(); }).then(function(data) { if (data.code === 200) renderTable(data.data); });
        }
        function renderTable(pd) {
            var tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            if (!pd.records || pd.records.length === 0) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">暂无数据</td></tr>'; return; }
            pd.records.forEach(function(item) {
                tbody.innerHTML += '<tr><td>'+(item.courseNo||'')+'</td><td>'+(item.courseName||'')+'</td><td>'+(item.courseType||'')+'</td><td>'+(item.credits||'')+'</td><td>'+(item.classHours||'')+'</td><td>'+(item.theoryHours||'')+'</td><td>'+(item.practiceHours||'')+'</td><td><button class="btn btn-sm btn-primary" onclick="editCourse('+item.id+')">编辑</button> <button class="btn btn-sm btn-danger" onclick="deleteCourse('+item.id+')">删除</button></td></tr>';
            });
            document.getElementById('paginationInfo').textContent = '共 '+pd.total+' 条，第 '+pd.page+'/'+pd.pages+' 页';
            var btns = document.getElementById('paginationBtns'); btns.innerHTML = '';
            for (var i=1;i<=pd.pages;i++) btns.innerHTML += '<button class="'+(i===currentPage?' active':'')+'" onclick="loadData('+i+')">'+i+'</button>';
        }
        function showAddModal() { document.getElementById('courseForm').reset(); document.getElementById('courseId').value=''; document.getElementById('modalTitle').textContent='新增课程'; filterTeachers(); document.getElementById('modalOverlay').style.display='flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display='none'; }
        function editCourse(id) {
            fetch('/course/'+id).then(function(res){return res.json();}).then(function(data){
                if(data.code===200){var s=data.data;document.getElementById('modalTitle').textContent='编辑课程';document.getElementById('courseId').value=s.id;document.getElementById('formCourseNo').value=s.courseNo||'';document.getElementById('formCourseName').value=s.courseName||'';document.getElementById('formCourseType').value=s.courseType||'公共必修';document.getElementById('formCredits').value=s.credits||0;document.getElementById('formClassHours').value=s.classHours||0;document.getElementById('formTheoryHours').value=s.theoryHours||0;document.getElementById('formPracticeHours').value=s.practiceHours||0;document.getElementById('formDeptId').value=s.deptId||'';filterTeachers();document.getElementById('formTeacherId').value=s.teacherId||'';document.getElementById('modalOverlay').style.display='flex';}
            });
        }
        function deleteCourse(id) { if(!confirm('确定删除？')) return; fetch('/course/'+id,{method:'DELETE'}).then(function(res){return res.json();}).then(function(data){if(data.code===200){alert('删除成功');loadData(currentPage);}else{alert(data.message);}}); }
        document.getElementById('courseForm').addEventListener('submit',function(e){e.preventDefault();var data={id:document.getElementById('courseId').value?parseInt(document.getElementById('courseId').value):null,courseNo:document.getElementById('formCourseNo').value,courseName:document.getElementById('formCourseName').value,courseType:document.getElementById('formCourseType').value,credits:document.getElementById('formCredits').value,classHours:document.getElementById('formClassHours').value,theoryHours:document.getElementById('formTheoryHours').value,practiceHours:document.getElementById('formPracticeHours').value,deptId:document.getElementById('formDeptId').value?parseInt(document.getElementById('formDeptId').value):null,teacherId:document.getElementById('formTeacherId').value?parseInt(document.getElementById('formTeacherId').value):null};fetch('/course/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(res){return res.json();}).then(function(r){if(r.code===200){alert('保存成功');closeModal();loadData(currentPage);}else{alert(r.message);}});});
        loadSelectData(); loadData(1);
    </script>
    <script src="/static/js/common.js"></script>
</body>
</html>
