# 应用配置
spring.application.name=校园教务管理系统
server.port=${PORT:8080}

# 数据源配置（本地默认 MySQL；云端 TiDB Cloud 通过环境变量注入，勿写死凭据）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/School_System?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.city.springboot_big_schoolwork.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto

# Thymeleaf配置
spring.thymeleaf.prefix=classpath:templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# 静态资源配置
spring.web.resources.static-locations=classpath:static/
spring.mvc.static-path-pattern=/static/**

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 日志配置
logging.level.com.city.springboot_big_schoolwork=debug
logging.level.org.springframework.web=info

# Jackson配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
